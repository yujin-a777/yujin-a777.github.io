# ─── Netlify 배포 설정 ───────────────────────────────────────────────
# 이 프로젝트는 빌드 도구 없는 순수 정적 사이트입니다.
# 빌드 명령 없이 저장소 루트를 그대로 공개합니다.

[build]
  # 빌드 명령 없음 — 정적 파일 그대로 서빙
  command = ""
  # 공개 루트: 저장소 루트 자체를 publish 디렉터리로 사용
  publish = "."

# ─── 공개 제외 경로 (Netlify는 _redirects·toml로 제어, 민감 파일 차단) ───
# .git, .kiro/settings 는 Netlify가 자동으로 배포하지 않음
# (Git 메타데이터는 빌드 단계에서 포함되지 않음)

# ─── HTTP 헤더 보안 설정 ─────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=()"

# ─── Netlify Functions 경로 ──────────────────────────────────────────
# 서버 함수는 netlify/functions/ 에만 위치
# publish 디렉터리(.) 에 절대 복사하지 않음
[functions]
  directory = "netlify/functions"

# ─── SPA 폴백 없음 (MPA 구조이므로 각 .html 파일로 직접 라우팅) ──────

# ─── API 라우트 리다이렉션 ───────────────────────────────────────────
# 프론트엔드에서 /api/scores 로 요청하면 Netlify Function 으로 전달
# 서버 함수 경로(/.netlify/functions/)를 직접 노출하지 않음
[[redirects]]
  from   = "/api/scores"
  to     = "/.netlify/functions/scores"
  status = 200

[[redirects]]
  from   = "/api/guestbook"
  to     = "/.netlify/functions/guestbook"
  status = 200

# ─── GitHub Pages 병행 운영 ──────────────────────────────────────────
# GitHub Pages (yujin-a777.github.io) 와 Netlify URL 동시 운영
# GitHub Pages 설정은 건드리지 않음
