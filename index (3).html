<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자기소개</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--text:#14213d;--mute:#5b6478;--accent:#2a7f8f;--line:#d6dde6}
@media (prefers-color-scheme:dark){:root{--bg:#10151f;--card:#182030;--text:#e8ecf4;--mute:#9aa4b8;--accent:#6cc4d3;--line:#27324a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;line-height:1.7;padding:32px 16px}
main{max-width:640px;margin:0 auto}
h1{font-size:2.4rem;margin:0 0 4px;letter-spacing:-.02em}
.tag{color:var(--mute);margin:0 0 28px;font-size:1.05rem}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px}
h2{font-size:1.05rem;margin:0 0 8px;color:var(--accent)}
p,li{margin:0}
ul{margin:0;padding-left:20px}
a{color:var(--accent);font-weight:600}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
footer{color:var(--mute);font-size:.85rem;margin-top:24px}
</style>
</head>
<body>
<main>
  <h1>안녕하세요, 장유진입니다</h1>
  <p class="tag">국민대학교에서 경영정보를 공부하는 낙천적인 20살 학생</p>

  <section>
    <h2>저는 이런 사람이에요</h2>
    <p>저는 20살이고, 국민대학교 경영정보학부에서 공부하는 학생입니다. 성격은 낙천적이라 어려운 일이 생겨도 일단 긍정적으로 받아들이고 해결 방법을 찾아보는 편입니다.</p>
  </section>

  <section>
    <h2>관심 있는 것</h2>
    <ul>
      <li>스포츠</li>
      <li>음식</li>
    </ul>
  </section>

  <section>
    <h2>연락처</h2>
    <p>연락처는 비공개입니다.</p>
  </section>

  <footer>다음 sprint: 사진 추가, 관심사 소개 확장</footer>
</main>
</body>
</html>
